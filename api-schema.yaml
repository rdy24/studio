openapi: 3.0.3
info:
    title: Voyage Control API
    description: Travel operations back office system API for managing users, roles, destinations, and voyages
    version: 1.0.0
    contact:
        name: Voyage Control Support
        email: support@voyagecontrol.com
    license:
        name: MIT
        url: https://opensource.org/licenses/MIT

servers:
    - url: https://api.voyagecontrol.com/v1
      description: Production server
    - url: https://staging-api.voyagecontrol.com/v1
      description: Staging server
    - url: http://localhost:3000/api/v1
      description: Development server

security:
    - bearerAuth: []

paths:
    # Authentication endpoints
    /auth/login:
        post:
            tags:
                - Authentication
            summary: User login
            description: Authenticate user with email and password
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - email
                                - password
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: alice@example.com
                                password:
                                    type: string
                                    format: password
                                    example: password123
            responses:
                "200":
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    token:
                                        type: string
                                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                                    user:
                                        $ref: "#/components/schemas/User"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /auth/logout:
        post:
            tags:
                - Authentication
            summary: User logout
            description: Invalidate user session
            responses:
                "200":
                    description: Logout successful
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Logged out successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"

    # User management endpoints
    /users:
        get:
            tags:
                - Users
            summary: Get all users
            description: Retrieve a paginated list of users with optional filtering
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: search
                  in: query
                  schema:
                      type: string
                  description: Search users by name, email, or role
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [Active, Inactive, Pending]
                - name: role_id
                  in: query
                  schema:
                      type: string
            responses:
                "200":
                    description: Users retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/User"
                                    pagination:
                                        $ref: "#/components/schemas/Pagination"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

        post:
            tags:
                - Users
            summary: Create a new user
            description: Create a new user account
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateUserRequest"
            responses:
                "201":
                    description: User created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /users/{id}:
        get:
            tags:
                - Users
            summary: Get user by ID
            description: Retrieve a specific user by their ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: User retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

        put:
            tags:
                - Users
            summary: Update user
            description: Update an existing user
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateUserRequest"
            responses:
                "200":
                    description: User updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"

        delete:
            tags:
                - Users
            summary: Delete user
            description: Delete a user account
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "204":
                    description: User deleted successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    # Role management endpoints
    /roles:
        get:
            tags:
                - Roles
            summary: Get all roles
            description: Retrieve all roles with their permissions
            responses:
                "200":
                    description: Roles retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Role"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

        post:
            tags:
                - Roles
            summary: Create a new role
            description: Create a new role with permissions
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateRoleRequest"
            responses:
                "201":
                    description: Role created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Role"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /roles/{id}:
        get:
            tags:
                - Roles
            summary: Get role by ID
            description: Retrieve a specific role by its ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Role retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Role"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

        put:
            tags:
                - Roles
            summary: Update role
            description: Update an existing role
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateRoleRequest"
            responses:
                "200":
                    description: Role updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Role"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"

        delete:
            tags:
                - Roles
            summary: Delete role
            description: Delete a role (only if not assigned to any users)
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "204":
                    description: Role deleted successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: Role cannot be deleted (assigned to users)

    # Destination management endpoints
    /destinations:
        get:
            tags:
                - Destinations
            summary: Get all destinations
            description: Retrieve a paginated list of destinations
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: search
                  in: query
                  schema:
                      type: string
                  description: Search destinations by name, country, or description
                - name: country
                  in: query
                  schema:
                      type: string
            responses:
                "200":
                    description: Destinations retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Destination"
                                    pagination:
                                        $ref: "#/components/schemas/Pagination"
                "401":
                    $ref: "#/components/responses/Unauthorized"

        post:
            tags:
                - Destinations
            summary: Create a new destination
            description: Create a new travel destination
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateDestinationRequest"
            responses:
                "201":
                    description: Destination created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Destination"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /destinations/{id}:
        get:
            tags:
                - Destinations
            summary: Get destination by ID
            description: Retrieve a specific destination by its ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Destination retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Destination"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"

        put:
            tags:
                - Destinations
            summary: Update destination
            description: Update an existing destination
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateDestinationRequest"
            responses:
                "200":
                    description: Destination updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Destination"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"

        delete:
            tags:
                - Destinations
            summary: Delete destination
            description: Delete a destination (only if not used in any voyages)
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "204":
                    description: Destination deleted successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: Destination cannot be deleted (used in voyages)

    # Voyage management endpoints
    /voyages:
        get:
            tags:
                - Voyages
            summary: Get all voyages
            description: Retrieve a paginated list of voyages
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: search
                  in: query
                  schema:
                      type: string
                  description: Search voyages by name or description
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [Upcoming, Ongoing, Completed, Cancelled]
                - name: destination_id
                  in: query
                  schema:
                      type: string
                - name: start_date_from
                  in: query
                  schema:
                      type: string
                      format: date
                - name: start_date_to
                  in: query
                  schema:
                      type: string
                      format: date
                - name: price_min
                  in: query
                  schema:
                      type: number
                      minimum: 0
                - name: price_max
                  in: query
                  schema:
                      type: number
                      minimum: 0
            responses:
                "200":
                    description: Voyages retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Voyage"
                                    pagination:
                                        $ref: "#/components/schemas/Pagination"
                "401":
                    $ref: "#/components/responses/Unauthorized"

        post:
            tags:
                - Voyages
            summary: Create a new voyage
            description: Create a new travel voyage
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateVoyageRequest"
            responses:
                "201":
                    description: Voyage created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Voyage"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /voyages/{id}:
        get:
            tags:
                - Voyages
            summary: Get voyage by ID
            description: Retrieve a specific voyage by its ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Voyage retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Voyage"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"

        put:
            tags:
                - Voyages
            summary: Update voyage
            description: Update an existing voyage
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateVoyageRequest"
            responses:
                "200":
                    description: Voyage updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Voyage"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"

        delete:
            tags:
                - Voyages
            summary: Delete voyage
            description: Delete a voyage (only if no bookings exist)
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "204":
                    description: Voyage deleted successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: Voyage cannot be deleted (has bookings)

    # Booking management endpoints
    /bookings:
        get:
            tags:
                - Bookings
            summary: Get all bookings
            description: Retrieve a paginated list of bookings
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: voyage_id
                  in: query
                  schema:
                      type: string
                - name: user_id
                  in: query
                  schema:
                      type: string
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [Pending, Confirmed, Cancelled, Completed]
                - name: payment_status
                  in: query
                  schema:
                      type: string
                      enum: [Pending, Paid, Refunded]
            responses:
                "200":
                    description: Bookings retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Booking"
                                    pagination:
                                        $ref: "#/components/schemas/Pagination"
                "401":
                    $ref: "#/components/responses/Unauthorized"

        post:
            tags:
                - Bookings
            summary: Create a new booking
            description: Create a new voyage booking
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateBookingRequest"
            responses:
                "201":
                    description: Booking created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Booking"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /bookings/{id}:
        get:
            tags:
                - Bookings
            summary: Get booking by ID
            description: Retrieve a specific booking by its ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Booking retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Booking"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"

        put:
            tags:
                - Bookings
            summary: Update booking
            description: Update an existing booking
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateBookingRequest"
            responses:
                "200":
                    description: Booking updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Booking"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"

    # Travel Schedule management endpoints
    /travel-schedules:
        get:
            tags:
                - Travel Schedules
            summary: Get all travel schedules
            description: Retrieve a paginated list of travel schedules
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: search
                  in: query
                  schema:
                      type: string
                  description: Search schedules by title, location, or description
                - name: voyage_id
                  in: query
                  schema:
                      type: string
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [Scheduled, "In Progress", Completed, Cancelled]
                - name: start_date_from
                  in: query
                  schema:
                      type: string
                      format: date-time
                - name: start_date_to
                  in: query
                  schema:
                      type: string
                      format: date-time
                - name: participant_id
                  in: query
                  schema:
                      type: string
            responses:
                "200":
                    description: Travel schedules retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/TravelSchedule"
                                    pagination:
                                        $ref: "#/components/schemas/Pagination"
                "401":
                    $ref: "#/components/responses/Unauthorized"

        post:
            tags:
                - Travel Schedules
            summary: Create a new travel schedule
            description: Create a new travel schedule for a voyage
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateTravelScheduleRequest"
            responses:
                "201":
                    description: Travel schedule created successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TravelSchedule"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /travel-schedules/{id}:
        get:
            tags:
                - Travel Schedules
            summary: Get travel schedule by ID
            description: Retrieve a specific travel schedule by its ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Travel schedule retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TravelSchedule"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"

        put:
            tags:
                - Travel Schedules
            summary: Update travel schedule
            description: Update an existing travel schedule
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateTravelScheduleRequest"
            responses:
                "200":
                    description: Travel schedule updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TravelSchedule"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"

        delete:
            tags:
                - Travel Schedules
            summary: Delete travel schedule
            description: Delete a travel schedule
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "204":
                    description: Travel schedule deleted successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    # Dashboard and analytics endpoints
    /dashboard/metrics:
        get:
            tags:
                - Dashboard
            summary: Get dashboard metrics
            description: Retrieve key metrics for the dashboard
            responses:
                "200":
                    description: Metrics retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DashboardMetrics"
                "401":
                    $ref: "#/components/responses/Unauthorized"

    /dashboard/activity:
        get:
            tags:
                - Dashboard
            summary: Get recent activity
            description: Retrieve recent system activity for the dashboard
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 50
                      default: 10
            responses:
                "200":
                    description: Activity retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/ActivityLog"
                "401":
                    $ref: "#/components/responses/Unauthorized"

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    schemas:
        User:
            type: object
            properties:
                id:
                    type: string
                    example: "1"
                name:
                    type: string
                    example: "Alice Wonderland"
                email:
                    type: string
                    format: email
                    example: "alice@example.com"
                role_id:
                    type: string
                    example: "1"
                role:
                    $ref: "#/components/schemas/Role"
                status:
                    type: string
                    enum: [Active, Inactive, Pending]
                    example: "Active"
